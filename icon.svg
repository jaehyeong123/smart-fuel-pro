<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Speedometer / Gauge Arc -->
  <path d="M 120 330 A 150 150 0 1 1 392 330" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-dasharray="8 12"/>
  <path d="M 120 330 A 150 150 0 0 1 290 125" fill="none" stroke="#facc15" stroke-width="32" stroke-linecap="round"/>

  <!-- Fuel Pump Symbol in Center -->
  <g transform="translate(196, 185) scale(1.15)">
    <!-- Pump body -->
    <rect x="10" y="20" width="70" height="110" rx="12" fill="#ffffff"/>
    <rect x="22" y="32" width="46" height="34" rx="6" fill="#0f172a"/>
    <!-- Liters display digits simulated -->
    <line x1="28" y1="49" x2="50" y2="49" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <!-- Hose & Nozzle -->
    <path d="M 80 45 C 105 45 105 100 86 115" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M 86 115 L 82 85 L 94 85" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speed Needle Accent -->
  <line x1="256" y1="280" x2="310" y2="180" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="280" r="14" fill="#ffffff"/>
</svg>
